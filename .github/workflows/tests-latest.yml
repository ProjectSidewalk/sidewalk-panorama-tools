name: Tests (latest dependencies)

# The drift report for constraints.txt and constraints-ci.txt (#167, #237). tests.yml installs the production
# box's pinned versions plus CI's own pins and gates every PR; this job installs what a fresh, unpinned production
# install gets (requirements.txt's floors, then streetlevel with --no-deps), plus the latest pytest and CPU-only
# torch, with NO constraints, so pip takes the latest release of everything, and runs the same suite. It never
# runs on a PR or a push, so it gates nothing. A red run here means a new upstream release breaks the suite, and
# production would hit it the next time it reinstalls from scratch. Read the failure, then fix the code, or bump
# constraints-ci.txt or tighten requirements.txt. Refreshing constraints.txt from the box is a separate step
# (docs/ops.md, "Refreshing constraints.txt").
on:
  schedule:
    # Mondays 15:00 UTC: Monday morning Pacific, so a red run sits at the top of the Actions tab at the start of
    # the week. (It runs on a GitHub-hosted runner and touches nothing on the production box.)
    - cron: '0 15 * * 1'
  workflow_dispatch:

jobs:
  pytest-latest:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # No pip cache and no -c: the point is a fresh resolve. streetlevel with --no-deps, as the box installs it
      # (#237), so a requirement a new release imports but requirements.txt does not list fails the hard import.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install --no-deps -r requirements-nodeps.txt
      # The latest CPU-only torch, for tests/test_torch_geometry.py: its requirements, then the wheel.
      - run: pip install filelock typing_extensions sympy networkx jinja2 fsspec
      - run: pip install --no-deps torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -c "import torch; print(torch.__version__)"
      # The resolved set, in the log, so a red run can be diffed against constraints.txt and constraints-ci.txt.
      - run: pip freeze
      # No --cov: the coverage floor is tests.yml's gate, and this job is about whether the suite passes.
      - run: python -m pytest tests -v --continue-on-collection-errors
        env:
          SIDEWALK_REQUIRE_STREETLEVEL: '1'
