name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Matches the production baseline: Ubuntu 22.04 / Python 3.10. streetlevel is installed the way the box
    # installs it (#237), so a requirement a new release imports but requirements.txt lacks fails the hard import.
    runs-on: ubuntu-22.04
    # GitHub's default is 6 hours, so a hung subprocess or a test waiting on a lock would hold the check (and
    # a runner) that long before failing. Measured 2026-09-27: the job takes 5.5-6.5 minutes end to end
    # (runs 36270192977 and 36337717048), most of it the pip install; pytest itself ~2m45s. 20 is ~3x that -
    # room for a slow runner or a cold pip resolve - while still failing a hang in minutes, not hours (#165).
    # Re-measured 2026-11-16 (#237): master's job took 13m37s-15m25s (runs 43726007931, 43727474183 and
    # 43727565985) and #237's 9m34s, so the margin is now under 1.5x on master's figures; not changed here.
    # Raised to 40 on 2026-11-24: PR heads measured 2026-11-22/23 took 15m35s-19m09s (#253, #254), and the same
    # tests took 9m45s and 17m11s on consecutive heads, so the spread is the runner and a green PR could fail on
    # time alone. 40 is about 2x the slowest run seen; a hang still fails in minutes, not hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          # The default key is requirements*.txt alone; a refreshed pin file must not reuse the old cache.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-nodeps.txt
            constraints.txt
            constraints-ci.txt
      # -c constraints.txt pins every package the production box has to the versions it runs (#167): it is the
      # box's pip freeze. -c constraints-ci.txt pins what CI installs and the box does not: the pytest runner and
      # the CPU-only torch below (#237). Other dev-only packages resolve fresh. Drift against the latest releases
      # is tests-latest.yml's job, weekly and not gating. Refreshing: docs/ops.md, "Refreshing constraints.txt".
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt -c constraints-ci.txt
      # streetlevel alone, with --no-deps, as the box installs it (#237): it declares pyequilib, which requires
      # torch and through it triton and the nvidia-*/cuda-* wheels, about 4.7 GB no production module imports.
      # What it does import is listed in requirements.txt. tests/test_constraints.py fails if this loses the flag.
      - run: pip install --no-deps -r requirements-nodeps.txt -c constraints.txt -c constraints-ci.txt
      # tests/test_torch_geometry.py needs torch, and .coveragerc measures torch_geometry.py in this job. Until
      # #237 torch arrived through streetlevel; now it is installed on purpose, CPU-only, the way the package job
      # does it: its requirements from PyPI, then the wheel from the CPU index with --no-deps.
      - run: pip install -c constraints.txt -c constraints-ci.txt filelock typing_extensions sympy networkx jinja2 fsspec
      - run: pip install -c constraints.txt -c constraints-ci.txt --no-deps torch --index-url https://download.pytorch.org/whl/cpu
      # A torch that cannot import would make test_torch_geometry.py skip, not fail, and the coverage gate would
      # still pass without it: fail here instead.
      - run: python -c "import torch; print(torch.__version__)"
      # What was installed, in the log.
      - run: pip freeze
      # Bare --cov takes its source and omissions from .coveragerc, so there is one place to change them.
      # skip-covered keeps the (already -v, 1400-test) log readable; the step summary below is not skipped,
      # so the PR view still shows every file including the ones at 100%.
      # SIDEWALK_REQUIRE_STREETLEVEL turns tests/test_streetlevel_api.py's importorskip into a hard import
      # (#165): streetlevel is installed above, so a missing transitive dependency must fail the run rather
      # than skip every contract test behind a green check. --continue-on-collection-errors because
      # that failure is a collection error, and pytest's default on one is to run nothing else: the run still
      # exits nonzero, but with every other test's result instead of "1 error" (#171 review).
      - run: python -m pytest tests -v --continue-on-collection-errors --cov --cov-report=term-missing:skip-covered
        env:
          SIDEWALK_REQUIRE_STREETLEVEL: '1'
      # always(), so a run that trips the fail_under gate still shows WHERE it lost coverage rather than
      # just failing. --fail-under=0 because the pytest step above is the gate; this step only reports.
      - name: Coverage summary
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

  # The installable package as a consumer gets it (docs/geometry.md). The job above already runs
  # tests/test_torch_geometry.py and gates its coverage, on a CPU-only torch it installs on purpose (#237). What
  # it never does is build the wheel the consumers pin, or run the torch path without streetlevel and the rest of
  # the scraper's requirements. This job does both, outside the checkout.
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # tests/conftest.py imports CropRunner for every test, so the runtime requirements come too - all but
      # streetlevel, which the conftest stubs and this job does not need. Then torch's own dependencies from PyPI
      # at the CI pins, and the CPU-only torch wheel at the pinned version with --no-deps: the CPU index does not
      # carry every pinned dependency version.
      - run: pip install -c constraints.txt -c constraints-ci.txt numpy pytest Pillow requests urllib3 aiohttp backoff filelock typing_extensions sympy networkx jinja2 fsspec
      - run: pip install -c constraints.txt -c constraints-ci.txt --no-deps torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_torch_geometry.py -v
      - name: Build the wheel and import it from a fresh venv
        run: |
          pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/wheelcheck"
          # Resolved first: unquoted, `*.whl[gsv]` below would be a glob character class (#222 step 2).
          WHL=$(ls "$RUNNER_TEMP"/dist/sidewalk_panorama_tools-*.whl)
          CONSTRAINTS="$PWD/constraints.txt"
          "$RUNNER_TEMP/wheelcheck/bin/pip" install -c "$CONSTRAINTS" "$WHL"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelcheck/bin/python" -c "
          import pano_pose, sidewalk_panorama_tools, sidewalk_panorama_tools.geometry as g, sidewalk_panorama_tools.torch_geometry as tg
          import sidewalk_panorama_tools.store as store, sidewalk_panorama_tools.ps_math as pm, sidewalk_panorama_tools.labels as lb
          import PIL.Image  # pillow is a package dependency since 1.1.0 (store.read_pano); a wheel without it fails here
          for m in (pano_pose, sidewalk_panorama_tools, g, tg, store, pm, lb):
              assert 'site-packages' in m.__file__, m.__file__
          view, tilt = g.label_view(0.5, 0.6, size=8, camera_pitch=3.0)
          assert store.shard('abcdef') == 'ab' and float(pm.get_3d_fov(1)) == 89.75
          assert lb.label_uid('seattle-wa', 1) == 'seattle-wa:1'
          print(sidewalk_panorama_tools.__version__, view, tilt is not None, PIL.__version__)
          "
          # The tile fetcher (#222 step 2): without the [gsv] extra its import names the extra; with it, it works.
          "$RUNNER_TEMP/wheelcheck/bin/python" -c "
          try:
              import sidewalk_panorama_tools.gsv_tiles
          except ImportError as e:
              assert '[gsv] extra' in str(e), e
          else:
              raise SystemExit('sidewalk_panorama_tools.gsv_tiles imported without the [gsv] extra installed')
          "
          "$RUNNER_TEMP/wheelcheck/bin/pip" install -c "$CONSTRAINTS" "${WHL}[gsv]"
          "$RUNNER_TEMP/wheelcheck/bin/python" -c "
          import sidewalk_panorama_tools.gsv_tiles as t
          assert 'site-packages' in t.__file__, t.__file__
          assert t._tile_grid(16384, 8192, 5) == (32, 16) and t._pano_max_zoom(13312) == 5
          print(t.CONCURRENCY, len(t.HEADERS))
          # The one call (#236): present, and a CAoS id refused before any request. Every request path is replaced
          # with one that fails first, so this step is network-free by construction, even if the refusal regressed.
          import inspect
          assert inspect.iscoroutinefunction(t.fetch_equirect_async) and callable(t.fetch_equirect)
          def no_request(*args, **kwargs):
              raise SystemExit('fetch_equirect made a request for a CAoS id')
          t._get_response = t._request_tile = no_request
          try:
              t.fetch_equirect('CAoSLEFGMVFpcE05ZHg3dFhIa1htX193c1JDUW10UmRKd1J4dDY1Ujk5cDFGYWlu', 16384, 8192)
          except t.PhotosphereUnsupportedError:
              pass
          else:
              raise SystemExit('fetch_equirect did not refuse a CAoS id')
          "
