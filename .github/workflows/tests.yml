name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Matches the production baseline: Ubuntu 22.04 / Python 3.10. Installing requirements.txt here also verifies that
    # streetlevel's dependency tree still pip-installs cleanly on that baseline.
    runs-on: ubuntu-22.04
    # GitHub's default is 6 hours, so a hung subprocess or a test waiting on a lock would hold the check (and
    # a runner) that long before failing. Measured 2026-09-27: the job takes 5.5-6.5 minutes end to end
    # (runs 36270192977 and 36337717048), most of it the pip install; pytest itself ~2m45s. 20 is ~3x that -
    # room for a slow runner or a cold pip resolve - while still failing a hang in minutes, not hours (#165).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          # The default key is requirements*.txt alone; a refreshed constraints.txt must not reuse the old cache.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt
      # -c pins every package the production box has to the versions it runs (#167): constraints.txt is the
      # box's pip freeze, so this job tests what production runs rather than whatever PyPI served today.
      # Packages the box does not have (the dev-only ones) resolve fresh. Drift against the latest releases is
      # tests-latest.yml's job, weekly and not gating. Refreshing the pins: docs/ops.md, "Refreshing
      # constraints.txt".
      - run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      # Bare --cov takes its source and omissions from .coveragerc, so there is one place to change them.
      # skip-covered keeps the (already -v, 1400-test) log readable; the step summary below is not skipped,
      # so the PR view still shows every file including the ones at 100%.
      # SIDEWALK_REQUIRE_STREETLEVEL turns tests/test_streetlevel_api.py's importorskip into a hard import
      # (#165): requirements.txt installs streetlevel here, so a missing transitive dependency must fail the
      # run rather than skip every contract test behind a green check. --continue-on-collection-errors because
      # that failure is a collection error, and pytest's default on one is to run nothing else: the run still
      # exits nonzero, but with every other test's result instead of "1 error" (#171 review).
      - run: python -m pytest tests -v --continue-on-collection-errors --cov --cov-report=term-missing:skip-covered
        env:
          SIDEWALK_REQUIRE_STREETLEVEL: '1'
      # always(), so a run that trips the fail_under gate still shows WHERE it lost coverage rather than
      # just failing. --fail-under=0 because the pytest step above is the gate; this step only reports.
      - name: Coverage summary
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

  # The installable package as a consumer gets it (docs/geometry.md). The job above already runs
  # tests/test_torch_geometry.py and gates its coverage: requirements.txt pulls torch in through streetlevel ->
  # pyequilib (constraints.txt pins it). What it never does is build the wheel the consumers pin, or run the
  # torch path on the CPU-only build an API box would install. This job does both, outside the checkout.
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # torch's own dependencies from PyPI at the production pins, then the CPU-only torch wheel at the pinned
      # version with --no-deps: the CPU index does not carry every pinned dependency version.
      - run: pip install -c constraints.txt numpy pytest filelock typing_extensions sympy networkx jinja2 fsspec
      - run: pip install -c constraints.txt --no-deps torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest tests/test_torch_geometry.py -v
      - name: Build the wheel and import it from a fresh venv
        run: |
          pip wheel --no-deps -w "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/wheelcheck"
          "$RUNNER_TEMP/wheelcheck/bin/pip" install -c constraints.txt "$RUNNER_TEMP"/dist/sidewalk_panorama_tools-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelcheck/bin/python" -c "
          import pano_pose, sidewalk_panorama_tools, sidewalk_panorama_tools.geometry as g, sidewalk_panorama_tools.torch_geometry as tg
          for m in (pano_pose, sidewalk_panorama_tools, g, tg):
              assert 'site-packages' in m.__file__, m.__file__
          view, tilt = g.label_view(0.5, 0.6, size=8, camera_pitch=3.0)
          print(sidewalk_panorama_tools.__version__, view, tilt is not None)
          "
