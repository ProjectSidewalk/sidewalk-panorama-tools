name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    # Matches the Docker image: Ubuntu 22.04 / Python 3.10. Installing requirements.txt here also verifies that
    # streetlevel's dependency tree still pip-installs cleanly on that baseline.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -v
